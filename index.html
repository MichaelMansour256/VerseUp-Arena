    <style>
        /* PWA Install Banner Styles */
        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(135deg, var(--header-bg-0) 0%, var(--header-bg-1) 55%, var(--header-bg-2) 100%);
            border-top: 1px solid var(--line-strong);
            padding: 16px 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.3);
        }
        
        .install-banner.visible {
            display: flex;
        }
        
        .install-banner-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .install-banner-text {
            color: var(--text);
            font-size: 0.95rem;
        }
        
        .install-banner-title {
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-strong);
        }
        
        .install-banner-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .install-banner-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .install-btn {
            background: linear-gradient(135deg, var(--accent-2) 0%, #7f5af0 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }
        
        .install-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(91, 140, 255, 0.4);
        }
        
        .install-btn:active {
            transform: translateY(0);
        }
        
        .dismiss-btn {
            background: transparent;
            border: 1px solid var(--line-strong);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .dismiss-btn:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }
        
        /* iOS standalone mode adjustments */
        @media (display-mode: standalone) {
            .install-banner {
                display: none !important;
            }
        }
        
        /* Safe area insets for notched devices */
        .container {
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        
        @media (max-width: 600px) {
            .container {
                padding-top: calc(10px + env(safe-area-inset-top));
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
